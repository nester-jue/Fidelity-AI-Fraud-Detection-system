version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: fide_fraud_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frauddb
    ports:
      - "5433:5432"
    volumes:
      - fide_db_data:/var/lib/postgresql/data
  api:
    build: .
    container_name: fide_fraud_api
    depends_on:
      - db
    ports:
      - "8010:8010"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frauddb
      JWT_SECRET_KEY: fidelity-life-nexa-fraud-detection-secret-2026
      PORT: 8010
volumes:
  fide_db_data:
