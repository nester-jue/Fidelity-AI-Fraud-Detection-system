<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="NEXA analytics environment showing fraud intelligence, transaction monitoring and risk dashboards">
  <!-- Clean white enterprise analytics illustration; Fidelity red accents only -->
  <rect width="720" height="480" rx="16" fill="#FFFFFF" stroke="#EEEEEE"/>

  <!-- header bar -->
  <rect x="24" y="24" width="672" height="56" rx="10" fill="#FCEBED"/>
  <rect x="40" y="40" width="120" height="14" rx="7" fill="#C8102E"/>
  <rect x="40" y="60" width="80" height="8" rx="4" fill="#8B0000"/>
  <circle cx="660" cy="52" r="8" fill="#C8102E"/>

  <!-- metric cards -->
  <g>
    <rect x="24" y="104" width="150" height="92" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
    <rect x="40" y="122" width="70" height="9" rx="4" fill="#EEEEEE"/>
    <rect x="40" y="144" width="95" height="18" rx="5" fill="#C8102E"/>
    <rect x="190" y="104" width="150" height="92" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
    <rect x="206" y="122" width="70" height="9" rx="4" fill="#EEEEEE"/>
    <rect x="206" y="144" width="80" height="18" rx="5" fill="#222222"/>
    <rect x="356" y="104" width="150" height="92" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
    <rect x="372" y="122" width="70" height="9" rx="4" fill="#EEEEEE"/>
    <rect x="372" y="144" width="88" height="18" rx="5" fill="#C8102E"/>
    <rect x="522" y="104" width="174" height="92" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
    <rect x="538" y="122" width="70" height="9" rx="4" fill="#EEEEEE"/>
    <rect x="538" y="144" width="100" height="18" rx="5" fill="#222222"/>
  </g>

  <!-- chart panel -->
  <rect x="24" y="216" width="432" height="240" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
  <!-- gridlines -->
  <g stroke="#EEEEEE" stroke-width="1">
    <line x1="48" y1="260" x2="432" y2="260"/>
    <line x1="48" y1="300" x2="432" y2="300"/>
    <line x1="48" y1="340" x2="432" y2="340"/>
    <line x1="48" y1="380" x2="432" y2="380"/>
  </g>
  <!-- area chart -->
  <path d="M48 380 L110 320 L172 340 L234 280 L296 300 L358 240 L432 250 L432 380 Z" fill="#FCEBED"/>
  <path d="M48 380 L110 320 L172 340 L234 280 L296 300 L358 240 L432 250" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#C8102E">
    <circle cx="110" cy="320" r="3.5"/><circle cx="234" cy="280" r="3.5"/><circle cx="358" cy="240" r="3.5"/><circle cx="432" cy="250" r="3.5"/>
  </g>
  <!-- bar chart inset -->
  <g fill="#C8102E">
    <rect x="48" y="392" width="24" height="36" rx="3"/><rect x="84" y="404" width="24" height="24" rx="3" fill="#8B0000"/><rect x="120" y="388" width="24" height="40" rx="3"/><rect x="156" y="412" width="24" height="16" rx="3" fill="#8B0000"/>
  </g>

  <!-- right column: risk list -->
  <rect x="480" y="216" width="216" height="240" rx="10" fill="#FFFFFF" stroke="#EEEEEE"/>
  <rect x="496" y="234" width="90" height="10" rx="5" fill="#EEEEEE"/>
  <g>
    <rect x="496" y="262" width="184" height="8" rx="4" fill="#EEEEEE"/><rect x="496" y="262" width="150" height="8" rx="4" fill="#C8102E"/>
    <rect x="496" y="290" width="184" height="8" rx="4" fill="#EEEEEE"/><rect x="496" y="290" width="110" height="8" rx="4" fill="#8B0000"/>
    <rect x="496" y="318" width="184" height="8" rx="4" fill="#EEEEEE"/><rect x="496" y="318" width="80" height="8" rx="4" fill="#C8102E"/>
  </g>
  <!-- high-risk badge -->
  <rect x="496" y="352" width="184" height="52" rx="8" fill="#8B0000"/>
  <rect x="512" y="370" width="110" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="512" y="388" width="70" height="8" rx="4" fill="#FCEBED"/>
</svg>
