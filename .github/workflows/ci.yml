name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/nexa-ci.sqlite
      PYTHONPATH: .
      ENVIRONMENT: development
      ALLOW_PUBLIC_REGISTRATION: "true"
      JWT_SECRET_KEY: ci-only-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # Test-only dependencies are not part of the runtime requirements.
      - name: Install test dependencies
        run: python -m pip install pytest httpx

      - name: Run backend tests
        # Runs from the repository root so tests/ and backend/ are importable.
        run: python -m pytest -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify typography (if script present)
        if: hashFiles('scripts/verify_typography.mjs') != ''
        run: node scripts/verify_typography.mjs
